name: CICD
run-name: "Running CICD by @${{ github.actor }} (Commit: ${{ github.sha }})."
on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened
    branches:
      - main

permissions:
  contents: write

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          presist-credentials: true

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --only-dev

      - name: Run ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Run pyrefly
        run: uv run pyrefly check

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-format codebase."

  test:
    runs-on: ${{ matrix.os }}
    needs: lint-and-format
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.14"
          - "3.15"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies (3.14)
        if: matrix.python-version == '3.14'
        run: uv sync --locked --all-extras --dev

      - name: Install dependencies (3.15+)
        if: matrix.python-version != '3.14'
        run: uv sync --upgrade --all-extras --dev

      - name: Run tests
        run: uv run pytest
