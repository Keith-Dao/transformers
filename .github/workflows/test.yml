name: Tests
run-name: "Running automated tests by @${{ github.actor }} (Commit: ${{ github.sha }})"

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
      - reopened
    branches:
      - main

jobs:
  check-lint-status:
    runs-on: ubuntu-latest
    steps:
      - name: Verify linter and formatter passed
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_NAME: "Linter and formatter"
        run: |
          echo "Checking '$WORKFLOW_NAME' workflow status for commit: $COMMIT_SHA"

          CONCLUSION=$(gh run list \
            --workflow "$WORKFLOW_NAME" \
            --commit "$COMMIT_SHA" \
            --json conclusion \
            --jq '.[0].conclusion')

          echo "Workflow conclusion is: $CONCLUSION"

          if [ "$CONCLUSION" != "success" ]; then
            echo "❌ The original lint workflow did not succeed (Status: $CONCLUSION)."
            echo "Please ensure the '$WORKFLOW_NAME' workflow passes before running tests."
            exit 1
          fi

          echo "✅ Original lint workflow passed successfully!"

  test:
    runs-on: ${{ matrix.os }}
    needs: check-lint-status
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.14"
          - "3.15"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies (3.14)
        if: matrix.python-version == '3.14'
        run: uv sync --locked --all-extras --dev

      - name: Install dependencies (3.15+)
        if: matrix.python-version != '3.14'
        run: uv sync --upgrade --all-extras --dev

      - name: Run tests
        run: uv run pytest
